<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Floppa FCA &amp; GoatBot v2 Cyber Crimson Banner</title>
  <desc id="bannerDesc">High-Velocity Facebook Chat API Engine with Priyansh Core Logic &amp; GoatBot v2 Native Resilience</desc>
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="cyberCanvas" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06030C"/>
      <stop offset="0.38" stop-color="#12061A"/>
      <stop offset="0.75" stop-color="#1A0718"/>
      <stop offset="1" stop-color="#050109"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF007F" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Fiery Cyberpunk Gradients -->
    <linearGradient id="crimsonGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF007F"/>
      <stop offset="0.3" stop-color="#FF5400"/>
      <stop offset="0.65" stop-color="#FFB703"/>
      <stop offset="1" stop-color="#9D4EDD"/>
    </linearGradient>

    <linearGradient id="orbCrimson" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF007F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5400" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbViolet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9D4EDD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C77DFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB703" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF5400" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="ambientBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="400" fill="url(#cyberCanvas)"/>
  <rect width="1200" height="400" fill="url(#cyberGrid)"/>

  <!-- Ambient Glowing Energy Orbs -->
  <circle cx="140" cy="70" r="200" fill="url(#orbCrimson)" filter="url(#ambientBlur)">
    <animate attributeName="cx" values="140;240;140" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="340" r="220" fill="url(#orbViolet)" filter="url(#ambientBlur)">
    <animate attributeName="cx" values="560;460;560" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="140" r="240" fill="url(#orbGold)" filter="url(#ambientBlur)">
    <animate attributeName="cy" values="140;220;140" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Cybernetic Wave Connections -->
  <g opacity="0.8">
    <path d="M 60 330 C 220 250 280 370 440 300 C 600 230 640 330 800 270 C 960 210 1020 300 1140 230" stroke="url(#crimsonGradient)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle cx="440" cy="300" r="5.5" fill="#FF007F">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="270" r="5.5" fill="#FFB703">
      <animate attributeName="r" values="4;8;4" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Logo Mark Container (Goat Horns + Messenger + Lightning Bolt) -->
  <g transform="translate(80, 72)" filter="url(#glowEffect)">
    <!-- Outer Emblem Shield -->
    <rect x="0" y="0" width="104" height="104" rx="28" fill="#13061C" fill-opacity="0.85" stroke="url(#crimsonGradient)" stroke-width="2.2"/>

    <!-- Left & Right Goat Horns inside emblem -->
    <path d="M 40 40 C 30 24 16 12 4 18 C -2 22 2 32 10 38 C 20 44 32 42 40 46 Z" fill="#FF5400" opacity="0.95"/>
    <path d="M 64 40 C 74 24 88 12 100 18 C 106 22 102 32 94 38 C 84 44 72 42 64 46 Z" fill="#9D4EDD" opacity="0.95"/>

    <!-- Messenger Speech Bubble -->
    <path d="M 52 32 C 32 32 16 46 16 62 C 16 71 21 78 28 84 L 25 94 L 39 88 C 43 90 48 91 52 91 C 72 91 88 77 88 62 C 88 46 72 32 52 32 Z" fill="#FF007F" fill-opacity="0.22" stroke="#FF007F" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Central Fiery Lightning Bolt -->
    <path d="M 56 40 L 36 62 H 48 L 44 80 L 68 56 H 54 L 56 40 Z" fill="url(#crimsonGradient)" stroke="#FFFFFF" stroke-width="0.9"/>
  </g>

  <!-- Title & Branding Text Elements -->
  <g transform="translate(206, 114)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="4">FLOPPA FCA</text>
    <text x="4" y="40" fill="#FF5400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="3.5">GOATBOT v2 &amp; FLOPPA-CHATBOT ENGINE</text>
    <text x="4" y="70" fill="#E0AAFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" letter-spacing="2">PRIYANSH FCA CORE LOGIC • NATIVE RESILIENCE • v5.1.0</text>
    
    <!-- Dynamic Animated Neon Energy Bar -->
    <rect x="4" y="90" width="220" height="4.5" rx="2.5" fill="url(#crimsonGradient)">
      <animate attributeName="width" values="120;340;120" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glassmorphic High-Tech Badges (Right Column) -->
  <g transform="translate(800, 72)">
    <!-- Badge 1: GoatBot v2 Ready -->
    <g filter="url(#shadowEffect)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#13061C" fill-opacity="0.8" stroke="#FF5400" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="26" cy="25" r="6" fill="#FF5400">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="30" fill="#FFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">🐐 GOATBOT v2 NATIVE READY</text>
    </g>

    <!-- Badge 2: Priyansh Core Logic -->
    <g transform="translate(0, 64)" filter="url(#shadowEffect)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#13061C" fill-opacity="0.8" stroke="#FF007F" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="26" cy="25" r="6" fill="#FF007F">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="30" fill="#FFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">⚡ PRIYANSH FCA CORE ENGINE</text>
    </g>

    <!-- Badge 3: Anti-Suspension Warmup -->
    <g transform="translate(0, 128)" filter="url(#shadowEffect)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#13061C" fill-opacity="0.8" stroke="#9D4EDD" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="26" cy="25" r="6" fill="#9D4EDD">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="30" fill="#FFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">🛡️ ANTI-SUSPENSION &amp; RESILIENCE</text>
    </g>

    <!-- Badge 4: Package Identifier -->
    <g transform="translate(0, 192)" filter="url(#shadowEffect)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#13061C" fill-opacity="0.8" stroke="#FFB703" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="26" cy="25" r="6" fill="#FFB703"/>
      <text x="44" y="30" fill="#FFB703" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="800" letter-spacing="1.5">📦 @floppa/fca • GITHUB ENGINE</text>
    </g>
  </g>
</svg>

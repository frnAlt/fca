<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FCA-Native</title>
  <desc id="desc">High-Performance Native Facebook Chat API Engine for GoatBot v2</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B18"/>
      <stop offset="0.5" stop-color="#0E172A"/>
      <stop offset="1" stop-color="#061824"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="92" x2="924" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secondaryGlow">
      <stop stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="160" cy="80" r="210" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="160;250;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;140;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="350" r="230" fill="url(#secondaryGlow)" filter="url(#blur)">
    <animate attributeName="cx" values="1060;950;1060" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="350;290;350" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Real-Time Signal Wave -->
  <g opacity="0.85">
    <path d="M80 318C242 248 266 366 420 296C574 226 616 332 752 270C888 208 949 304 1120 210" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="420" cy="296" r="5" fill="#38BDF8">
      <animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="752" cy="270" r="5" fill="#34D399">
      <animate attributeName="r" values="4;9;4" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Logo Icon Container -->
  <g filter="url(#shadow)">
    <rect x="86" y="86" width="76" height="76" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <!-- Messenger Bolt Symbol -->
    <path d="M124 98C106.327 98 92 111.431 92 128C92 137.472 96.657 145.897 103.882 151.35V161L113.125 155.932C116.52 156.908 120.177 157.447 124 157.447C141.673 157.447 156 144.016 156 127.447C156 110.878 141.673 98 124 98ZM125.688 135.2L116.8 125.75L99.5 135.2L118.5 115.1L127.4 124.55L144.6 115.1L125.688 135.2Z" fill="url(#accent)"/>
    <circle cx="116" cy="117" r="2" fill="#38BDF8"/>
    <circle cx="124" cy="117" r="2" fill="#818CF8"/>
    <circle cx="132" cy="117" r="2" fill="#34D399"/>
  </g>

  <!-- Header & Subtitle -->
  <text x="86" y="234" fill="white" font-family="Inter,Segoe UI,-apple-system,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="6">FCA-NATIVE</text>
  <text x="92" y="272" fill="#93C5FD" font-family="Inter,Segoe UI,-apple-system,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="4">NATIVE MESSENGER CHAT API FOR GOATBOT V2</text>
  
  <rect x="92" y="302" width="140" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="80;200;80" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Release Tag -->
  <g transform="translate(980, 88)">
    <rect width="134" height="34" rx="17" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="67" y="22" fill="#38BDF8" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">v5.0.0 CORE</text>
  </g>
</svg>

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Floppa FCA &amp; GoatBot v2 Cyber Crimson Logo</title>
  <desc id="logoDesc">High-Velocity Facebook Chat API Engine with Priyansh Core &amp; GoatBot v2 Resilience</desc>
  <defs>
    <!-- Obsidian & Crimson Void Background -->
    <linearGradient id="cyberBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07040D"/>
      <stop offset="0.4" stop-color="#14071D"/>
      <stop offset="0.75" stop-color="#1C0616"/>
      <stop offset="1" stop-color="#08020A"/>
    </linearGradient>

    <!-- Fiery Cyberpunk Neon Rim -->
    <linearGradient id="cyberRim" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007F"/>
      <stop offset="0.35" stop-color="#FF5400"/>
      <stop offset="0.65" stop-color="#FFB703"/>
      <stop offset="0.85" stop-color="#9D4EDD"/>
      <stop offset="1" stop-color="#05FFA1"/>
    </linearGradient>

    <!-- Left Horn (Fiery Neon Crimson / Gold) -->
    <linearGradient id="hornLeft" x1="90" y1="110" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007F"/>
      <stop offset="0.5" stop-color="#FF5400"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>

    <!-- Right Horn (Electric Ultraviolet / Amethyst) -->
    <linearGradient id="hornRight" x1="422" y1="110" x2="292" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9D4EDD"/>
      <stop offset="0.5" stop-color="#C77DFF"/>
      <stop offset="1" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Chat Bubble (Dark Ruby / Deep Plasma Translucent) -->
    <linearGradient id="plasmaBubble" x1="114" y1="180" x2="398" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007F" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#9D4EDD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF5400" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Central Lightning Plasma Bolt (Molten Gold to Hot Pink) -->
    <linearGradient id="plasmaBolt" x1="220" y1="200" x2="330" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF066"/>
      <stop offset="0.3" stop-color="#FFB703"/>
      <stop offset="0.7" stop-color="#FF5400"/>
      <stop offset="1" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boltFire" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container with Plasma Neon Rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#cyberBg)" stroke="url(#cyberRim)" stroke-width="4.5" filter="url(#crimsonGlow)"/>

  <!-- Orbiting Cyber Gyro Rings -->
  <circle cx="256" cy="256" r="202" stroke="url(#cyberRim)" stroke-width="1.4" stroke-dasharray="12 16" stroke-opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="32s" repeatCount="indefinite"/>
  </circle>

  <circle cx="256" cy="256" r="176" stroke="#FF5400" stroke-width="0.9" stroke-opacity="0.25" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="360 256 256" to="0 256 256" dur="24s" repeatCount="indefinite"/>
  </circle>

  <!-- GoatBot v2 Cybernetic Horns (Left: Molten Crimson-Gold, Right: Ultraviolet-Magenta) -->
  <g filter="url(#crimsonGlow)">
    <!-- Left Goat Horn -->
    <path d="M 218 194 C 188 150 142 112 94 126 C 72 134 68 162 88 178 C 112 198 152 196 198 214 Z" fill="url(#hornLeft)" stroke="#FFB703" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M 122 146 C 144 158 174 178 196 204" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>

    <!-- Right Goat Horn -->
    <path d="M 294 194 C 324 150 370 112 418 126 C 440 134 444 162 424 178 C 400 198 360 196 314 214 Z" fill="url(#hornRight)" stroke="#C77DFF" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M 390 146 C 368 158 338 178 316 204" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Messenger Chat Bubble -->
  <g filter="url(#crimsonGlow)">
    <path d="M 256 182 C 176 182 114 238 114 306 C 114 344 134 378 166 400 L 152 444 L 214 420 C 228 426 242 430 256 430 C 336 430 398 374 398 306 C 398 238 336 182 256 182 Z" fill="url(#plasmaBubble)" stroke="url(#cyberRim)" stroke-width="6.5" stroke-linejoin="round"/>
  </g>

  <!-- Fiery Plasma Bolt (Priyansh Core Velocity) -->
  <g filter="url(#boltFire)">
    <path d="M 278 208 L 184 314 H 250 L 230 398 L 334 282 H 268 L 278 208 Z" fill="url(#plasmaBolt)" stroke="#FFF" stroke-width="1.4">
      <animate attributeName="opacity" values="1;0.82;1" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bottom Cyber Tag: GOATBOT v2 • PRIYANSH -->
  <g transform="translate(136, 442)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#0A0412" stroke="url(#cyberRim)" stroke-width="1.6"/>
    <circle cx="16" cy="14" r="4.5" fill="#FF007F">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="2">GOATBOT v2 • PRIYANSH</text>
  </g>

  <!-- Tech Accent Sparkles -->
  <circle cx="140" cy="116" r="4" fill="#FFB703" opacity="0.9"/>
  <circle cx="372" cy="116" r="4" fill="#FF007F" opacity="0.9"/>
  <circle cx="86" cy="256" r="3" fill="#05FFA1" opacity="0.75"/>
  <circle cx="426" cy="256" r="3" fill="#9D4EDD" opacity="0.75"/>
</svg>

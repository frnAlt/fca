<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Floppa FCA &amp; GoatBot v2 Logo</title>
  <desc id="logoDesc">Official Logo for @floppa/fca with Priyansh Core &amp; GoatBot v2 Engine</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="fcaBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050714"/>
      <stop offset="0.45" stop-color="#0b112c"/>
      <stop offset="0.85" stop-color="#120c24"/>
      <stop offset="1" stop-color="#051824"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="fcaNeonRim" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE"/>
      <stop offset="0.3" stop-color="#38BDF8"/>
      <stop offset="0.6" stop-color="#818CF8"/>
      <stop offset="0.85" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Goat Horns Gradient -->
    <linearGradient id="hornGradLeft" x1="100" y1="100" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.4" stop-color="#00F2FE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hornGradRight" x1="412" y1="100" x2="292" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Messenger Bubble Gradient -->
    <linearGradient id="fcaBubbleGrad" x1="120" y1="170" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.26"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="fcaBoltGrad" x1="210" y1="200" x2="320" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="0.8" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="fcaOuterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fcaHornGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fcaBoltGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container with Cyber Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#fcaBgGrad)" stroke="url(#fcaNeonRim)" stroke-width="4.5" filter="url(#fcaOuterGlow)"/>

  <!-- Rotating Tech Ring -->
  <circle cx="256" cy="256" r="200" stroke="url(#fcaNeonRim)" stroke-width="1.2" stroke-dasharray="10 14" stroke-opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="36s" repeatCount="indefinite"/>
  </circle>

  <!-- Concentric Inner Shield Ring -->
  <circle cx="256" cy="256" r="172" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="4 8"/>

  <!-- GoatBot v2 Cybernetic Horns (Left & Right) -->
  <g filter="url(#fcaHornGlow)">
    <!-- Left Goat Horn -->
    <path d="M 218 194 C 188 152 144 114 98 128 C 76 135 72 162 90 178 C 114 198 154 196 198 214 Z" fill="url(#hornGradLeft)" stroke="#00F2FE" stroke-width="2.5" stroke-linejoin="round" opacity="0.95"/>
    <path d="M 124 148 C 146 160 174 178 196 204" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Goat Horn -->
    <path d="M 294 194 C 324 152 368 114 414 128 C 436 135 440 162 422 178 C 398 198 358 196 314 214 Z" fill="url(#hornGradRight)" stroke="#C084FC" stroke-width="2.5" stroke-linejoin="round" opacity="0.95"/>
    <path d="M 388 148 C 366 160 338 178 316 204" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Messenger Chat Bubble Container -->
  <g filter="url(#fcaOuterGlow)">
    <!-- Main Chat Bubble Body -->
    <path d="M 256 182 C 176 182 114 238 114 306 C 114 344 134 378 166 400 L 152 444 L 214 420 C 228 426 242 430 256 430 C 336 430 398 374 398 306 C 398 238 336 182 256 182 Z" fill="url(#fcaBubbleGrad)" stroke="url(#fcaNeonRim)" stroke-width="6.5" stroke-linejoin="round"/>
  </g>

  <!-- Center Dynamic Lightning Bolt (Priyansh FCA Engine Core) -->
  <g filter="url(#fcaBoltGlow)">
    <path d="M 276 210 L 186 314 H 250 L 232 396 L 332 284 H 268 L 276 210 Z" fill="url(#fcaBoltGrad)" stroke="#FFFFFF" stroke-width="1.2">
      <animate attributeName="opacity" values="1;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Tech Badge Pill: GOATBOT v2 • FLOPPA -->
  <g transform="translate(146, 442)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#070A1A" stroke="url(#fcaNeonRim)" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2">GOATBOT v2 • FCA</text>
  </g>

  <!-- Corner Tech Accent Dots -->
  <circle cx="140" cy="116" r="3.5" fill="#10B981" opacity="0.8"/>
  <circle cx="372" cy="116" r="3.5" fill="#C084FC" opacity="0.8"/>
  <circle cx="86" cy="256" r="3" fill="#00F2FE" opacity="0.6"/>
  <circle cx="426" cy="256" r="3" fill="#818CF8" opacity="0.6"/>
</svg>

<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Floppa FCA &amp; GoatBot v2 Banner</title>
  <desc id="bannerDesc">High-Performance Facebook Chat API Engine for GoatBot v2 &amp; Floppa-Chatbot with Priyansh Core Logic</desc>
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040614"/>
      <stop offset="0.4" stop-color="#090f26"/>
      <stop offset="0.75" stop-color="#120c26"/>
      <stop offset="1" stop-color="#031422"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="0.35" stop-color="#00F2FE"/>
      <stop offset="0.7" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="glowEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="blurOrbs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="400" fill="url(#bannerBg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient Dynamic Glowing Energy Orbs -->
  <circle cx="140" cy="70" r="200" fill="url(#glowEmerald)" filter="url(#blurOrbs)">
    <animate attributeName="cx" values="140;220;140" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="340" r="220" fill="url(#glowPurple)" filter="url(#blurOrbs)">
    <animate attributeName="cx" values="560;480;560" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="140" r="240" fill="url(#glowCyan)" filter="url(#blurOrbs)">
    <animate attributeName="cy" values="140;220;140" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Cybernetic Pulse Wave Connecting Left & Right -->
  <g opacity="0.75">
    <path d="M 60 330 C 220 250 280 370 440 300 C 600 230 640 330 800 270 C 960 210 1020 300 1140 230" stroke="url(#neonCyanPurple)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle cx="440" cy="300" r="5" fill="#10B981">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="270" r="5" fill="#00F2FE">
      <animate attributeName="r" values="4;8;4" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Logo Mark Container (Goat Horns + Messenger + Lightning Bolt) -->
  <g transform="translate(80, 72)" filter="url(#logoGlow)">
    <!-- Outer Emblem Shield -->
    <rect x="0" y="0" width="104" height="104" rx="28" fill="#090E26" fill-opacity="0.85" stroke="url(#neonCyanPurple)" stroke-width="2"/>

    <!-- Left & Right Goat Horns inside emblem -->
    <path d="M 40 40 C 30 24 16 12 4 18 C -2 22 2 32 10 38 C 20 44 32 42 40 46 Z" fill="#10B981" opacity="0.9"/>
    <path d="M 64 40 C 74 24 88 12 100 18 C 106 22 102 32 94 38 C 84 44 72 42 64 46 Z" fill="#C084FC" opacity="0.9"/>

    <!-- Messenger Speech Bubble -->
    <path d="M 52 32 C 32 32 16 46 16 62 C 16 71 21 78 28 84 L 25 94 L 39 88 C 43 90 48 91 52 91 C 72 91 88 77 88 62 C 88 46 72 32 52 32 Z" fill="#00F2FE" fill-opacity="0.18" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Central Lightning Bolt -->
    <path d="M 56 40 L 36 62 H 48 L 44 80 L 68 56 H 54 L 56 40 Z" fill="url(#neonCyanPurple)" stroke="#FFFFFF" stroke-width="0.8"/>
  </g>

  <!-- Title & Branding Text Elements -->
  <g transform="translate(206, 114)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="4">FLOPPA FCA</text>
    <text x="4" y="40" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="3.5">GOATBOT v2 &amp; FLOPPA-CHATBOT ENGINE</text>
    <text x="4" y="70" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" letter-spacing="2">PRIYANSH FCA CORE LOGIC • NATIVE RESILIENCE • v5.1.0</text>
    
    <!-- Dynamic Animated Neon Energy Bar -->
    <rect x="4" y="90" width="220" height="4.5" rx="2.5" fill="url(#neonCyanPurple)">
      <animate attributeName="width" values="120;340;120" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glassmorphic High-Tech Badges (Right Column) -->
  <g transform="translate(800, 72)">
    <!-- Badge 1: GoatBot v2 Ready -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#090E26" fill-opacity="0.75" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.4"/>
      <circle cx="26" cy="25" r="6" fill="#10B981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="30" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">🐐 GOATBOT v2 NATIVE READY</text>
    </g>

    <!-- Badge 2: Priyansh Core Logic -->
    <g transform="translate(0, 64)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#090E26" fill-opacity="0.75" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.4"/>
      <circle cx="26" cy="25" r="6" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="30" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">⚡ PRIYANSH FCA CORE ENGINE</text>
    </g>

    <!-- Badge 3: Anti-Suspension Warmup -->
    <g transform="translate(0, 128)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#090E26" fill-opacity="0.75" stroke="#C084FC" stroke-opacity="0.45" stroke-width="1.4"/>
      <circle cx="26" cy="25" r="6" fill="#C084FC">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="30" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">🛡️ ANTI-SUSPENSION &amp; RESILIENCE</text>
    </g>

    <!-- Badge 4: Package Identifier -->
    <g transform="translate(0, 192)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#090E26" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.4"/>
      <circle cx="26" cy="25" r="6" fill="#38BDF8"/>
      <text x="44" y="30" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="800" letter-spacing="1.5">📦 @floppa/fca • GITHUB ENGINE</text>
    </g>
  </g>
</svg>
